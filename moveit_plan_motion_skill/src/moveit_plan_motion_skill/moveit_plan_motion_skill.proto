syntax = "proto3";

package com.generic.skills.motion;

import "intrinsic/icon/proto/joint_space.proto";

message MotionPlanningParams {
  string group_name = 1;
  double timeout_ms = 2;
}

message MotionPlanningResult {
  double planning_time = 1;
  bool success = 2;
  repeated intrinsic_proto.icon.JointVec geometric_trajectory = 3;
  repeated intrinsic_proto.icon.JointStatePVA parameterized_trajectory = 4;
}
