syntax = "proto3";

package intrinsic;

// Configuration message for MoveIt planning service.
message MoveItPlanningServiceConfig {
  // Timeout in seconds when calling ROS 2 services (such as MoveIt planning scene
  // or Flowstate ROS bridge collision objects).
  // Default: 5.0
  double ros_service_call_timeout_sec = 1;

  // Time interval in seconds between retry attempts when populating collision
  // objects from the bridge.
  // Default: 2.0
  double add_collision_retry_interval_sec = 2;

  // Requires the MoveIt planning scene to contain one or more collision objects
  // before transitioning the planning node to the ready state.
  // Default: true
  optional bool expect_collision_objects = 3;

  // Whether to start mock ros2_control hardware for offline testing without
  // the Flowstate ROS bridge.
  // Default: false
  optional bool use_mock_hardware = 4;
}
