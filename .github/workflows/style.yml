name: Style Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  clang_format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: make format-check
