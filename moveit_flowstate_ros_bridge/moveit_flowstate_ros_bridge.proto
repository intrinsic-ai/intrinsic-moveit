syntax = "proto3";

package intrinsic;

// Configuration for MoveIt scene bridge ROS 2 node parameters.
message MoveItSceneBridgeConfig {
  // Prefix for the world frame in TF. When publishing the static transform to "root",
  // if this prefix is non-empty, it is used as the parent frame ID (otherwise "world").
  // Default: ""
  string world_tf_prefix = 1;

  // List of TF prefixes to strip from Flowstate frame names when publishing transforms
  // to ROS 2. Prevents namespace collisions or duplicate prefixes with URDF models.
  // Default: [""]
  repeated string strip_flowstate_tf_prefix = 2;

  // HTTP URL prefix prepended to collision object mesh resource URIs retrieved from
  // Flowstate. Allows ROS 2 nodes and RViz to fetch mesh geometry files over HTTP.
  // Default: "http://localhost:8123/"
  string mesh_url_prefix = 3;

  // The ROS 2 topic on which moveit_msgs::msg::CollisionObject messages are published
  // to populate and update the MoveIt planning scene.
  // Default: "/collision_object"
  string collision_objects_topic = 4;

  // List of Flowstate object namespaces to ignore when bridging collision objects into
  // the MoveIt scene. Crucial for excluding robot arm links or end-effectors already
  // modeled in the URDF/SRDF, preventing self-collision false positives.
  // Default: ["ur_module", "robotiq_gripper", "ecat_ft_hal_module_with_adapters_with_sim"]
  repeated string excluded_collision_namespaces = 5;

  // Whether to subscribe to Flowstate joint states and publish them to a ROS 2
  // JointState topic for MoveIt's CurrentStateMonitor and robot_state_publisher.
  // Default: true
  optional bool enable_robot_joint_state_topic = 6;

  // The ROS 2 topic name where bridged sensor_msgs::msg::JointState messages are published.
  // Default: "/joint_states"
  string robot_joint_state_topic = 7;

  // The Flowstate scene mounting frame ID for the robot arm base. Used as the parent
  // frame when publishing the static transform <robot_base_frame_id> -> base_link.
  // Default: "ur_module/base_link"
  string robot_base_frame_id = 8;

  // The Flowstate controller instance name used to filter or target joint state and
  // trajectory updates for a specific robot manipulator.
  // Default: "icon"
  string robot_controller_instance = 9;

  // Whether to throttle high-frequency Flowstate joint state updates before publishing
  // to ROS 2, reducing CPU and DDS bandwidth overhead.
  // Default: false
  bool throttle_robot_state_topic = 10;

  // Explicit list of joint names used to override or map Flowstate joint state indices
  // to standard URDF joint names when bridging joint states.
  // Default: ["shoulder_pan_joint", "shoulder_lift_joint", "elbow_joint",
  //           "wrist_1_joint", "wrist_2_joint", "wrist_3_joint"]
  repeated string override_joint_names = 11;

  // Maximum frequency (in Hz) at which collision object pose updates are evaluated
  // and published to collision_objects_topic.
  // Default: 10.0
  double collision_objects_update_rate_hz = 12;

  // Minimum translational movement (in meters) required for an object before a new
  // collision object pose update is published, filtering out simulation/perception jitter.
  // Default: 0.001
  double collision_objects_min_position_delta = 13;

  // Minimum angular rotation change required for an object before a new collision
  // object pose update is published.
  // Default: 0.01
  double collision_objects_min_rotation_delta = 14;

  // Whether the bridge automatically broadcasts a static transform from the world
  // frame (world_tf_prefix or "world") to "root".
  // Default: true
  optional bool publish_world_root_tf = 15;

  // Whether the bridge automatically broadcasts a static transform from robot_base_frame_id
  // to "base_link" (with a 180-degree yaw rotation around Z to align SDFormat with URDF).
  // Default: true
  optional bool publish_robot_base_tf = 16;
}

// https://github.com/intrinsic-ai/sdk-ros/blob/main/flowstate_ros_bridge/flowstate_ros_bridge.proto
message FlowstateRosBridgeConfig {
  string workcell_id = 1;
  string executive_service_address = 2;
  string skill_registry_address = 3;
  string solution_service_address = 4;
  string world_service_address = 5;
  string geometry_service_address = 6;
  string flowstate_zenoh_router_address = 7;
  optional string external_zenoh_router_address = 8;
  repeated string bridge_plugins = 9;
  int64 executive_deadline_seconds = 10;
  int64 executive_update_rate_millis = 11;
  MoveItSceneBridgeConfig moveit_scene_bridge_config = 12;
}
